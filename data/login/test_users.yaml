# data/test_users.yaml
# 支持按不同系统 不同角色配置多种登陆用户
#有效用户-用户端 ：支持按角色构造批量用户
valid_user_users:
  - role: "default"  #用户端主要是这个用户操作
    username: "tester"
    password: "SecurePass123!"
  - role: "sell"    # 用户端 操作买卖，卖的用户；default对应买的用户
    username: "admin"
    password: "AdminPass456!"

#有效用户-后台：支持按角色构造批量用户，这个框架权限暂时设计了admin权限角色 + NORMAL 普通权限
valid_back_users:
  - role: "ADMIN"
    username: "HOUTAIMIN"
    password: "123A"
  - role: "NORMAL"
    username: "XIXI"
    password: "123AA"


#无效用户-用户端
invalid_user_users:

  - name: "无效登陆01:用户名密码都错误"
    input:
     username: "xixi"
     password: "xixi123"
    expected:
      status_code: 401
      error: "用户名或密码错误"

  - name: "无效登陆02:用户名存在，密码错误"
    input:
      username: "tester"
      password: "SecurePass123!111"
    expected:
      status_code: 401
      error: "用户名或密码错误"

  - name: "无效登陆03:用户名输入超长"
    input:
      username: "xixi1asdasdasda123123123123231231231231231231231231"
      password: "xixi123"
    expected:
      status_code: 401
      error: "用户名或密码错误"

  - name: "无效登陆04:用户名为空"
    input:
      username: null
      password: "SecurePass123!"
    expected:
      status_code: 400
      error: "用户名或密码不能为空"

  - name: "无效登陆05:密码为空"
    input:
      username: "tester"
      password: null
    expected:
      status_code: 400
      error: "用户名或密码不能为空"

  - name: "无效登陆06:密码字母大小写错误"
    input:
      username: "tester"
      password: "securePass123!"
    expected:
      status_code: 401
      error: "用户名或密码错误"

  - name: "无效登陆07:密码输入超长"
    input:
      username: "tester"
      password: "securePass123!1231sadasdaasdas啊圣诞节啊是啊是的123123123123"
    expected:
      status_code: 401
      error: "用户名或密码错误"









