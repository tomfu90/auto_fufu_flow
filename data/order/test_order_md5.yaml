test_cases:
  success_cases: #成功用例
    - name: "创建订单01_创建成功：cny订单"
      signature:
        key_id: "{{en.md5_key}}"
        secret: "{{en.md5_secret}}"
      input:
        product_id: "AB3"
        amount: 100
        order_type: "DEPOSIT"
        currency: "CNY"
      expected:
        status_code: 201
        amount: 100
        product_id: "AB3"
    - name: "创建订单02_创建成功：USD订单"
      signature:
        key_id: "{{en.md5_key}}"
        secret: "{{en.md5_secret}}"
      input:
        product_id: "AB4"
        amount: 100.55
        order_type: "PAYMENT"
        currency: "USD"
      expected:
        status_code: 201
        amount: 100.55
        product_id: "AB3"

  fail_cases: #失败用例
    - name: "创建订单03_创建失败：金额非数字"
      signature:
        key_id: "{{en.md5_key}}"
        secret: "{{en.md5_secret}}"
      input:
        product_id: "AB3"
        amount: "abc"
        order_type: "DEPOSIT"
        currency: "CNY"
      expected:
        status_code: 400
        error: "Invalid amount"

    - name: "创建订单04_创建失败：product_id为空"
      signature:
        key_id: "{{en.md5_key}}"
        secret: "{{en.md5_secret}}"
      input:
        product_id: null
        amount: 200
        order_type: "DEPOSIT"
        currency: "CNY"
      expected:
        status_code: 400
        error: "Invalid product_id"

    - name: "创建订单05_创建失败：product_id长度不对"
      signature:
        key_id: "{{en.md5_key}}"
        secret: "{{en.md5_secret}}"
      input:
        product_id: "a"
        amount: 200
        order_type: "DEPOSIT"
        currency: "CNY"
      expected:
        status_code: 400
        error: "Invalid product_id"

    - name: "创建订单06_创建失败：currency无效"
      signature:
        key_id: "{{en.md5_key}}"
        secret: "{{en.md5_secret}}"
      input:
        product_id: "aaa"
        amount: 200
        order_type: "DEPOSIT"
        currency: "CNY2"
      expected:
        status_code: 400
        error: "Invalid currency"

    - name: "创建订单07_创建失败：order_type无效"
      signature:
        key_id: "{{en.md5_key}}"
        secret: "{{en.md5_secret}}"
      input:
        product_id: "aaa"
        amount: 200
        order_type: "DEPOSIT3"
        currency: "CNY"
      expected:
        status_code: 400
        error: "Invalid order_type"

    - name: "创建订单08_创建失败：签名错误_秘钥错误导致"
      signature:
        key_id: "{{en.md5_key}}"
        secret: "SuperSecretKey456!2"
      input:
        product_id: "aaa"
        amount: 200
        order_type: "DEPOSIT3"
        currency: "CNY"
      expected:
        status_code: 401
        error: "Invalid MD5 signature"

    - name: "创建订单09_创建失败：签名错误_api_key错误导致"
      signature:
        key_id: "abc1231"
        secret: "{{en.md5_secret}}"
      input:
        product_id: "aaa"
        amount: 200
        order_type: "DEPOSIT3"
        currency: "CNY"
      expected:
        status_code: 401
        error: "Invalid or inactive API key"

    - name: "创建订单10_创建失败：签名错误_api_key为空"
      signature:
        key_id: null
        secret: "{{en.md5_secret}}"
      input:
        product_id: "aaa"
        amount: 200
        order_type: "DEPOSIT3"
        currency: "CNY"
      expected:
        status_code: 400
        error: "Missing 'public_key' field in body"




