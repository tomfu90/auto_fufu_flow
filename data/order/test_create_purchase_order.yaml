# data/order/test_create_purchase_order.yaml
test_cases:
  success_cases:
    - name: "购买下单01_创建成功：完全购买"
      description: "将挂单金额完全购买"
      listing_scenario: "other_active"
      # purchase_amount ：1 total-表示买全部  2 null-表示为空 3-动态计算，表示增加/减少 4- 非动态计算，直接就是入参
      purchase_amount: "total"
      # dynamic:False 表示不动态计算，入参金额等于yaml_purchase_amount ; # True 表示动态计算，入参金额= 挂单接口 挂单金额 +/- yaml_purchase_amount
      dynamic: False   # False 表示不动态计算，入参金额等于yaml_purchase_amount
      expected:
        status_code: 201
        message: "Purchase order created and pending review"
        status: "PENDING_REVIEW"

    - name: "购买下单02_创建成功：部分购买"
      description: "购买挂单金额减5"
      listing_scenario: "other_active"
      purchase_amount: -5  #此处表示部分购买：挂单金额-5
      dynamic: True # True 表示动态计算，入参金额= 挂单接口 挂单金额 +/- yaml_purchase_amount
      expected:
        status_code: 201
        message: "Purchase order created and pending review"
        status: "PENDING_REVIEW"

  fail_cases:
    - name: "购买下单03_创建失败：购买金额超过挂单金额"
      description: "购买金额 = 挂单金额 + 5"
      listing_scenario: "other_active"
      purchase_amount: +5 #此处表示金额超买：挂单金额+5
      dynamic: True # True 表示动态计算，入参金额= 挂单接口 挂单金额 +/- yaml_purchase_amount
      expected:
        status_code: 400
        error: "purchase_amount cannot exceed listing amount"

    - name: "购买下单04_创建失败：挂单不存在"
      description: "使用不存在的 listing_id"
      listing_scenario: "nonexistent"
      purchase_amount: 100
      dynamic: False
      expected:
        status_code: 404
        error: "Listing not found"

    - name: "购买下单05_创建失败：挂单已取消"
      description: "挂单状态为 canceled"
      listing_scenario: "canceled"
      purchase_amount: "total"
      dynamic: False
      expected:
        status_code: 400
        error: "Listing is not available for purchase"

    - name: "购买下单06_创建失败：挂单已完成"
      description: "挂单状态为 sold"
      listing_scenario: "sold"
      purchase_amount: "total"
      dynamic: False
      expected:
        status_code: 400
        error: "Listing is not available for purchase"

    - name: "购买下单07_创建失败：购买本人挂单"
      description: "buyer 和 seller 是同一人"
      listing_scenario: "self"
      purchase_amount: "total"
      dynamic: False
      expected:
        status_code: 400
        error: "Cannot buy your own listing"

    - name: "购买下单08_创建失败：重复下单"
      description: "对同一挂单重复下单"
      listing_scenario: "other_active"
      purchase_amount: "total"
      dynamic: False
      duplicate: True #表示重复下单
      expected:
        status_code: 400
        error: "You have already placed an order for this listing"

    - name: "购买下单09_创建失败：金额为空"
      description: "purchase_amount 字段缺失"
      listing_scenario: "other_active"
      purchase_amount: null
      dynamic: False
      expected:
        status_code: 400
        error: "purchase_amount is required"

    - name: "购买下单10_创建失败：金额非数字"
      description: "purchase_amount = 'abc'"
      listing_scenario: "other_active"
      purchase_amount: "abc"
      dynamic: False
      expected:
        status_code: 400
        error: "purchase_amount must be a valid number"

    - name: "购买下单11_创建失败：金额小于0"
      description: "purchase_amount = -1"
      listing_scenario: "other_active"
      purchase_amount: -1
      dynamic: False
      expected:
        status_code: 400
        error: "purchase_amount must be greater than 0"

    - name: "购买下单12_创建失败：小数位数 > 2"
      description: "purchase_amount = 10.555"
      listing_scenario: "other_active"
      purchase_amount: 10.555
      dynamic: False
      expected:
        status_code: 400
        error: "purchase_amount cannot have more than 2 decimal places"

    - name: "购买下单13_创建失败：挂单号为空"
      description: "listing_id 为 null"
      listing_scenario: "null_id"
      purchase_amount: 100
      dynamic: False
      expected:
        status_code: 400
        error: "Missing listing_id"